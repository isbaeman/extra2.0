<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Loading Animation</title>
<style>
  :root {
    --bg: #000000;
    --ink: #f2f2f2;
    --dim: #6f737b;
    --track: #1a1c20;
    --glow: #8fb8ff;
    --glow-2: #c7a6ff;
    --size: min(72vmin, 280px);
  }
/*okk soo jb bhi kisi cheez ko index.html ya kisi bhi file may add kro ya change kro usky bad ctrl + s lazmii krna hy phir git add . or add or . may space hona chaheyay */
  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body { height: 100%; background: var(--bg); }

  body {
    display: grid;
    place-items: center;
    color: var(--ink);
    font-family: "Segoe UI", system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif;
    overflow: hidden;
  }

  .stage {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 2.5rem;
  }

  /* ---------- Loader ---------- */
  .loader {
    position: relative;
    width: var(--size);
    height: var(--size);
  }

  /* progress ring */
  .ring {
    position: absolute;
    inset: 0;
    transform: rotate(-90deg);
  }
  .ring circle {
    fill: none;
    stroke-width: 1.5;
  }
  .ring .track { stroke: var(--track); }
  .ring .bar {
    stroke: url(#grad);
    stroke-linecap: round;
    stroke-dasharray: 0 1000;
    filter: drop-shadow(0 0 6px rgba(143, 184, 255, .55));
  }

  /* orbiting dots */
  .orbit {
    position: absolute;
    inset: 0;
    animation: spin 14s linear infinite;
  }
  .dot {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 8px;
    height: 8px;
    margin: -4px 0 0 -4px;
    border-radius: 50%;
    background: var(--ink);
    transform: rotate(calc(var(--i) * 15deg)) translateY(calc(var(--size) * -0.36));
    animation: wave 1.8s cubic-bezier(.45, 0, .25, 1) infinite;
    animation-delay: calc(var(--i) * -0.075s);
    transition: opacity .6s ease, transform .8s cubic-bezier(.6, 0, .2, 1);
  }

  /* centre readout */
  .readout {
    position: absolute;
    inset: 0;
    display: grid;
    place-content: center;
    text-align: center;
    gap: .35rem;
  }
  .percent {
    font-size: calc(var(--size) * 0.2);
    font-weight: 200;
    letter-spacing: -0.02em;
    font-variant-numeric: tabular-nums;
    line-height: 1;
  }
  .percent small {
    font-size: .4em;
    color: var(--dim);
    margin-left: .1em;
    font-weight: 300;
  }

  /* status line */
  .status {
    height: 1.4em;
    color: var(--dim);
    font-size: .95rem;
    letter-spacing: .04em;
    transition: opacity .3s ease, transform .3s ease;
  }
  .status.swap { opacity: 0; transform: translateY(6px); }

  /* ---------- Complete state ---------- */
  .loader.done .orbit { animation-play-state: paused; }
  .loader.done .dot {
    animation: none;
    opacity: 0;
    transform: rotate(calc(var(--i) * 15deg)) translateY(0) scale(.2);
  }
  .loader.done .ring .bar { stroke-dasharray: 1000 0 !important; }
  .loader.done .ring { animation: pulse 1.2s ease-out 1; }
  .loader.done .percent { animation: pop .5s ease-out both; }

  button {
    appearance: none;
    background: transparent;
    color: var(--ink);
    border: 1px solid #2a2d33;
    border-radius: 999px;
    padding: .65rem 1.5rem;
    font: inherit;
    font-size: .9rem;
    letter-spacing: .03em;
    cursor: pointer;
    opacity: 0;
    pointer-events: none;
    transform: translateY(6px);
    transition: opacity .4s ease, transform .4s ease, border-color .2s ease, background .2s ease;
  }
  button.show { opacity: 1; pointer-events: auto; transform: none; }
  button:hover { border-color: var(--glow); background: rgba(143, 184, 255, .08); }
  button:focus-visible { outline: 2px solid var(--glow); outline-offset: 3px; }

  /* ---------- Keyframes ---------- */
  @keyframes spin { to { transform: rotate(360deg); } }

  @keyframes wave {
    0%, 100% { transform: rotate(calc(var(--i) * 15deg)) translateY(calc(var(--size) * -0.36)) scale(.35); opacity: .25; }
    50%      { transform: rotate(calc(var(--i) * 15deg)) translateY(calc(var(--size) * -0.36)) scale(1.5); opacity: 1;
               background: var(--glow); box-shadow: 0 0 14px var(--glow); }
  }

  @keyframes pulse {
    0%   { filter: drop-shadow(0 0 0 rgba(143, 184, 255, 0)); }
    40%  { filter: drop-shadow(0 0 16px rgba(143, 184, 255, .7)); }
    100% { filter: drop-shadow(0 0 0 rgba(143, 184, 255, 0)); }
  }

  @keyframes pop {
    0%   { transform: scale(.85); opacity: .4; }
    100% { transform: scale(1); opacity: 1; }
  }

  @media (prefers-reduced-motion: reduce) {
    .orbit { animation: none; }
    .dot { animation-duration: 4s; }
  }
</style>
</head>
<body>

<main class="stage">
  <div class="loader" id="loader" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" aria-label="Loading">
    <svg class="ring" viewBox="0 0 100 100" aria-hidden="true">
      <defs>
        <linearGradient id="grad" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%" stop-color="#8fb8ff"/>
          <stop offset="100%" stop-color="#c7a6ff"/>
        </linearGradient>
      </defs>
      <circle class="track" cx="50" cy="50" r="48"/>
      <circle class="bar" id="bar" cx="50" cy="50" r="48"/>
    </svg>

    <div class="orbit" id="orbit" aria-hidden="true"></div>

    <div class="readout">
      <div class="percent"><span id="num">0</span><small>%</small></div>
    </div>
  </div>

  <p class="status" id="status" aria-live="polite">Getting things ready</p>
  <button id="replay" type="button">Replay</button>
</main>

<script>
  (function () {
    const COUNT = 24;
    const orbit  = document.getElementById('orbit');
    const loader = document.getElementById('loader');
    const bar    = document.getElementById('bar');
    const num    = document.getElementById('num');
    const status = document.getElementById('status');
    const replay = document.getElementById('replay');

    const CIRC = 2 * Math.PI * 48;
    const DURATION = 7000;

    const messages = [
      [0,  'Getting things ready'],
      [25, 'Loading assets'],
      [55, 'Building the interface'],
      [80, 'Almost there'],
      [100, 'All set']
    ];

    // Create the dots
    for (let i = 0; i < COUNT; i++) {
      const d = document.createElement('span');
      d.className = 'dot';
      d.style.setProperty('--i', i);
      orbit.appendChild(d);
    }

    let raf, start, lastMsg = -1;

    function setStatus(text) {
      status.classList.add('swap');
      setTimeout(() => {
        status.textContent = text;
        status.classList.remove('swap');
      }, 280);
    }

    // Uneven progress: fast, slow, fast, like a real load
    function ease(t) {
      const slow = 0.5 - 0.5 * Math.cos(t * Math.PI);
      const wobble = 0.04 * Math.sin(t * Math.PI * 6);
      return Math.min(1, Math.max(0, slow + wobble * (1 - t)));
    }

    function frame(now) {
      if (!start) start = now;
      const t = Math.min(1, (now - start) / DURATION);
      const p = Math.round(ease(t) * 100);

      num.textContent = p;
      bar.style.strokeDasharray = (p / 100 * CIRC) + ' ' + CIRC;
      loader.setAttribute('aria-valuenow', p);

      for (let m = messages.length - 1; m >= 0; m--) {
        if (p >= messages[m][0]) {
          if (m !== lastMsg && m < messages.length - 1) { lastMsg = m; setStatus(messages[m][1]); }
          break;
        }
      }

      if (t < 1) {
        raf = requestAnimationFrame(frame);
      } else {
        finish();
      }
    }

    function finish() {
      num.textContent = 100;
      loader.classList.add('done');
      setStatus('All set');
      replay.classList.add('show');
    }

    function run() {
      cancelAnimationFrame(raf);
      start = null;
      lastMsg = -1;
      loader.classList.remove('done');
      replay.classList.remove('show');
      bar.style.strokeDasharray = '0 ' + CIRC;
      num.textContent = 0;
      setStatus(messages[0][1]);
      raf = requestAnimationFrame(frame);
    }

    replay.addEventListener('click', run);
    run();
  })();
</script>
</body>
</html>
